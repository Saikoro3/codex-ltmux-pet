name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install build dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Verify tag and package version
        run: |
          PACKAGE_VERSION="$(python -c 'from lumi_monitor import __version__; print(__version__)')"
          test "v$PACKAGE_VERSION" = "${GITHUB_REF_NAME}"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check .
          python -m unittest discover -s tests -v
      - name: Build and checksum release files
        run: |
          python -m build
          cp install.sh dist/install.sh
          cd dist
          sha256sum codex_ltmux_pet-* install.sh > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Lumi Codex Pet ${GITHUB_REF_NAME}" --generate-notes --verify-tag
